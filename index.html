<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Stream</title>
    <style>
        :root {
            --bg-black: #0f0f0f;
            --card-gray: #1a1a1a;
            --accent-red: #e50914;
            --text-white: #ffffff;
            --text-dim: #b3b3b3;
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-black);
            color: var(--text-white);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-bottom: 50px;
        }

        /* Header Area */
        header {
            width: 100%;
            padding: 20px 0;
            text-align: center;
        }

        .logo {
            font-size: 1.2rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-white);
        }

        /* Video Player Container */
        .player-container {
            width: 95%;
            max-width: 1000px;
            aspect-ratio: 16 / 9;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid #333;
            position: relative;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Channel Selection */
        .channel-section {
            width: 95%;
            max-width: 1000px;
            margin-top: 25px;
        }

        .section-title {
            font-size: 0.9rem;
            margin-bottom: 15px;
            color: var(--text-dim);
            text-transform: uppercase;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 10px;
        }

        /* Simple Channel Button Style */
        .channel-card {
            background: var(--card-gray);
            border: 1px solid #333;
            border-radius: 6px;
            padding: 12px 8px;
            text-align: center;
            cursor: pointer;
            transition: background 0.2s;
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--text-white);
        }

        .channel-card:hover {
            background: #252525;
        }

        .channel-card.active {
            border-color: var(--accent-red);
            background: var(--accent-red);
        }

        /* Mobile Optimization */
        @media (max-width: 600px) {
            .grid {
                grid-template-columns: repeat(3, 1fr);
            }
            .channel-card {
                font-size: 0.75rem;
                padding: 10px 5px;
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">Live Stream</div>
    </header>

    <div class="player-container">
        <iframe 
            id="video-player" 
            src="https://cineplyr.pages.dev/hotstar/" 
            allowfullscreen>
        </iframe>
    </div>

    <div class="channel-section">
        <div class="section-title">Channels</div>
        <div class="grid" id="channel-grid">
            
            <div class="channel-card active" onclick="changeChannel('https://cineplyr.pages.dev/hotstar/', this)">
                Jio Hotstar
            </div>

            <div class="channel-card" onclick="changeChannel('https://cineplyr.pages.dev/hubsports/', this)">
                Hub Sports
            </div>

            <div class="channel-card" onclick="changeChannel('https://cineplyr.pages.dev/star/1hindi/', this)">
                Star Hindi
            </div>

            <div class="channel-card" onclick="changeChannel('https://cineplyr.pages.dev/star/1eng/', this)">
                Star English
            </div>

            <div class="channel-card" onclick="changeChannel('https://cineplyr.pages.dev/hotstar/', this)">
                Fox Sports
            </div>

        </div>
    </div>

    <script>
        function changeChannel(url, element) {
            const player = document.getElementById('video-player');
            player.src = url;

            const cards = document.querySelectorAll('.channel-card');
            cards.forEach(card => card.classList.remove('active'));
            element.classList.add('active');
            
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
    </script>

</body>
</html>
