<!DOCTYPE html> 
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Live Stream</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<style>
:root { --p: #00ff6a; --b: #0a0a0a; }
*{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}

body { 
    margin: 0; 
    font-family: -apple-system, BlinkMacSystemFont, sans-serif; 
    background: var(--b); 
    color: #fff; 
    overflow: hidden; 
    user-select: none; 
}

.main-ui { 
    display: flex; 
    flex-direction: column; 
    justify-content: center;
    height: 100vh; 
    max-width: 900px; 
    margin: 0 auto; 
    padding: 15px; 
}

.video-container { 
    width: 100%; 
    position: relative; 
    padding-top: 56.25%; 
    background: #000; 
    border-radius: 12px; 
    overflow: hidden; 
    border: 1px solid rgba(255,255,255,0.1); 
    box-shadow: 0 10px 40px rgba(0,0,0,0.6);
}

#stream-player { 
    position: absolute; 
    top: 0; 
    left: 0; 
    width: 100%; 
    height: 100%; 
    border: none; 
}

/* Expiry Message Styling */
.expired-msg {
    text-align: center;
    color: #ff4444;
    font-weight: bold;
}
</style>
</head>

<body oncontextmenu="return false">

<div class="main-ui" id="app-container">
  <div class="video-container" id="viewport">
      <iframe 
          id="stream-player"
          src="https://livetv7.pages.dev/4?id=1HD" 
          allow="autoplay; encrypted-media; fullscreen; picture-in-picture" 
          sandbox="allow-scripts allow-same-origin allow-forms allow-popups"
          allowfullscreen="true">
      </iframe>
  </div>
</div>

<script>
/**
 * Expiry Logic
 * Target Date: June 1, 2026
 */
const checkExpiry = () => {
    const expiryDate = new Date('2026-06-01');
    const currentDate = new Date();

    if (currentDate >= expiryDate) {
        document.getElementById('app-container').innerHTML = `
            <div class="expired-msg">
                <h2>Access Expired</h2>
                <p>This stream link expired on June 1, 2026.</p>
            </div>
        `;
    }
};

// Run check on load
checkExpiry();

/* Simple security for the source code */
document.onkeydown = (e) => {
    if(e.keyCode == 123 || 
      (e.ctrlKey && e.shiftKey && (e.keyCode == 73 || e.keyCode == 74)) || 
      (e.ctrlKey && e.keyCode == 85)) {
        return false;
    }
};
</script>

</body>
</html>
