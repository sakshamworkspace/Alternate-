<!DOCTYPE html> 
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Star Sports 1 Hindi | Secure Player</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<style>
:root { --p: #00ff6a; --b: #0a0a0a; }
*{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}

body { 
    margin: 0; 
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
    background: var(--b); 
    color: #fff; 
    overflow: hidden; 
    user-select: none; 
}

.main-ui { 
    display: flex; 
    flex-direction: column; 
    /* This centers the content vertically */
    justify-content: center; 
    height: 100vh; 
    padding: 20px; 
    max-width: 900px;
    margin: 0 auto;
}

.header { 
    display: flex; 
    justify-content: space-between; 
    align-items: center; 
    padding: 10px 0; 
    /* Reduced margin to keep it tight with the player */
    margin-bottom: 10px; 
}

.logo { font-weight: 800; font-size: 20px; letter-spacing: -0.5px; }
.live-tag { 
    background: #ff0000; 
    padding: 4px 12px; 
    border-radius: 4px; 
    font-size: 11px; 
    font-weight: bold; 
    text-transform: uppercase;
}

.video-container { 
    width: 100%; 
    position: relative; 
    padding-top: 56.25%; /* 16:9 Aspect Ratio */
    background: #111; 
    border-radius: 12px; 
    overflow: hidden; 
    border: 1px solid rgba(255,255,255,0.1); 
    box-shadow: 0 20px 50px rgba(0,0,0,0.8);
}

#stream-player { 
    position: absolute; 
    top: 0; 
    left: 0; 
    width: 100%; 
    height: 100%; 
    border: none; 
    display: none; 
}

.overlay {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.7);
    backdrop-filter: blur(15px);
    -webkit-backdrop-filter: blur(15px);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    z-index: 10;
    transition: 0.4s ease;
}

.start-btn {
    background: var(--p);
    color: #000;
    border: none;
    padding: 14px 32px;
    font-size: 16px;
    font-weight: bold;
    border-radius: 50px;
    cursor: pointer;
    text-transform: uppercase;
    box-shadow: 0 0 20px rgba(0, 255, 106, 0.4);
    transition: 0.2s;
}

.start-btn:active { transform: scale(0.95); }

.error-msg {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    width: 100%;
}
</style>
</head>

<body oncontextmenu="return false">

<div class="main-ui">
  <!-- Content inside here is now vertically and horizontally centered -->
  <div class="header">
    <div class="logo">STAR <span style="color:var(--p)">SPORTS 1 HINDI</span></div>
    <div class="live-tag">LIVE</div>
  </div>

  <div class="video-container" id="viewport">
      <div class="overlay" id="player-overlay">
          <button class="start-btn" onclick="startStream()">Start Stream</button>
          <p style="font-size:11px; color:#aaa; margin-top:12px;">Click to join the live broadcast</p>
      </div>

      <iframe 
          id="stream-player"
          src="" 
          allow="autoplay; encrypted-media; fullscreen; picture-in-picture" 
          allowfullscreen="true" 
          referrerpolicy="no-referrer">
      </iframe>
  </div>
</div>

<script>
const _0xH1 = "SHR0cHM6Ly9saXZldHY3LnBhZ2VzLmRldi80P2lkPTFIRA==";

const now = new Date();
const expiry = new Date(2026, 5, 1);

if (now >= expiry) {
    document.getElementById('viewport').innerHTML = `
        <div class="error-msg">
            <p style="font-size: 18px; color: #ff4444;">Stream Link Expired</p>
        </div>`;
}

function startStream() {
    const player = document.getElementById('stream-player');
    const overlay = document.getElementById('player-overlay');
    player.src = atob(_0xH1);
    player.style.display = 'block';
    overlay.style.opacity = '0';
    setTimeout(() => { overlay.style.display = 'none'; }, 400);
}

document.onkeydown = (e) => {
    if(e.keyCode == 123 || (e.ctrlKey && e.shiftKey && (e.keyCode == 73 || e.keyCode == 74)) || (e.ctrlKey && e.keyCode == 85)) return false;
};
</script>

</body>
</html>
